name: eval

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    # Always-on: imports + config parse, no API keys required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install project
        run: uv sync --no-dev
      - name: Smoke-import all modules
        run: |
          uv run python -c "
          import thesis_builder, thesis_builder.llm, thesis_builder.tools
          import thesis_builder.schemas, thesis_builder.prompts, thesis_builder.graph
          from thesis_builder.agents import Researcher, Skeptic, Synthesizer
          import yaml; yaml.safe_load(open('config/models.yaml'))
          print('ok')
          "

  golden-eval:
    # Live eval against the three golden themes. Skipped unless the repo has
    # the required secrets — pricey to run on every PR otherwise.
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ vars.RUN_GOLDEN_EVAL == 'true' }}
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      THESIS_MAX_COST_USD: "0.50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync
      - name: Run eval
        run: uv run python -m evals.run_eval --min-per-dim 3
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-outputs
          path: outputs/
