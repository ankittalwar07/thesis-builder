[project]
name = "thesis-builder"
version = "0.1.0"
description = "Multi-agent CLI that turns any investment theme into an investable value chain tree."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.52",
    "instructor>=1.6",
    "langgraph>=0.2.50",
    "pydantic>=2.9",
    "rich>=13.9",
    "diskcache>=5.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.3",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.5"]
edgar = ["sec-edgar-downloader>=5.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
thesis = "thesis_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_builder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["evals", "tests"]
asyncio_mode = "auto"
